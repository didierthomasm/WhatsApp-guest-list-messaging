<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest Messenger — Carolina &amp; Didier</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div class="app">
    <header class="app-header" id="app-header"></header>

    <div class="app-body">
      <section class="list-section">
        <div class="list-toolbar" id="list-toolbar"></div>
        <div class="tag-filter-row" id="tag-filter-row"></div>
        <div class="list-scroll" id="list-scroll"></div>
      </section>

      <aside class="detail-pane">
        <div class="pane-scroll" id="pane-scroll"></div>
        <div class="pane-footer" id="pane-footer"></div>
      </aside>
    </div>

    <div class="focus-overlay hidden" id="focus-overlay"></div>
  </div>

  <script id="initial-data" type="application/json">{{ initial_data_json|safe }}</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
